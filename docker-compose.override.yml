# Please consult our docs for more info: https://www.librechat.ai/docs/configuration/docker_override

# TO USE THIS FILE, FIRST UNCOMMENT THE LINE ('services:')

# THEN UNCOMMENT ONLY THE SECTION OR SECTIONS CONTAINING THE CHANGES YOU WANT TO APPLY
# SAVE THIS FILE AS 'docker-compose.override.yaml'
# AND USE THE 'docker compose build' & 'docker compose up -d' COMMANDS AS YOU WOULD NORMALLY DO

# WARNING: YOU CAN ONLY SPECIFY EVERY SERVICE NAME ONCE (api, mongodb, meilisearch, ...)
# IF YOU WANT TO OVERRIDE MULTIPLE SETTINGS IN ONE SERVICE YOU WILL HAVE TO EDIT ACCORDINGLY

# EXAMPLE: if you want to use the config file and the latest numbered release docker image the result will be:

# services:
#   api:
#     volumes:
#     - type: bind
#       source: ./librechat.yaml
#       target: /app/librechat.yaml
#     image: registry.librechat.ai/danny-avila/librechat:latest

# ---------------------------------------------------

services:

# USE LIBRECHAT CONFIG FILE + LOCAL BUILD
  api:
    image: librechat
    build:
      context: .
      target: node
    depends_on:
      agents-gateway:
        condition: service_healthy
    environment:
      - AGENTS_GATEWAY_URL=http://agents-gateway:8001
    volumes:
    - type: bind
      source: ./librechat.yaml
      target: /app/librechat.yaml
    - type: bind
      source: ./client/dist
      target: /app/client/dist

# AGENTS GATEWAY - FastAPI wrapper using OpenAI Agents SDK
  agents-gateway:
    build:
      context: ./agents-gateway
    container_name: agents-gateway
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DOC_KB_MODEL=${DOC_KB_MODEL:-gpt-5-mini}
      - DOC_KB_INCLUDE_REASONING=${DOC_KB_INCLUDE_REASONING:-false}
      - GOOGLE_CALENDAR_MCP_URL=http://google-calendar-mcp:3000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

# EXPOSE pgvector port so pgvector-explorer can connect from the host
  vectordb:
    ports:
      - "5432:5432"

# Google Calendar MCP server (HTTP/SSE transport, OAuth 2.0)
# First run: exec into the container and authorize via browser:
#   docker compose exec google-calendar-mcp npx google-calendar-mcp auth
  google-calendar-mcp:
    image: node:20-slim
    container_name: google-calendar-mcp
    working_dir: /app
    command: npx -y google-calendar-mcp
    ports:
      - "3000:3000"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PORT=3000
    volumes:
      - type: bind
        source: ./google_token.json
        target: /app/token.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

